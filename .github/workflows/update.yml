name: Update products & deploy site

on:
  schedule:
    - cron: '0 4 * * *' # daily 04:00 UTC (06:00 Swedish time)
  workflow_dispatch:
    inputs:
      stores:
        description: 'Store ids to refresh, comma-separated (empty = all), e.g. satisfy,uvu'
        required: false
        default: ''
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    # On a normal code push we only redeploy; scraping runs on schedule / manual trigger.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch products
        env:
          STORES: ${{ inputs.stores }}
          # Optional: lets Claude classify products the taxonomy rules can only guess at.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update.mjs
      - name: Update taxonomy report
        run: node scripts/taxonomy-doc.mjs
      # Supabase pauses a free project after a week without requests; one small read a day keeps
      # sign-in and syncing (web/sync.js) awake. Uses the public URL and key from web/config.js.
      - name: Keep Supabase awake
        continue-on-error: true
        run: |
          url=$(grep -o "https://[a-z0-9]*\.supabase\.co" web/config.js)
          key=$(grep -o "sb_publishable_[A-Za-z0-9_-]*" web/config.js)
          curl -sf "$url/rest/v1/saved_products?select=product_id&limit=1" -H "apikey: $key" > /dev/null
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data TAXONOMY.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update product data $(date -u +%F)"
            git push
          fi

  deploy:
    needs: update
    if: ${{ !cancelled() && (needs.update.result == 'success' || needs.update.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # include the data commit made by the update job
      # The site is built by the Rust crate in site/ (compact feed, pre-rendered start page).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site
      - run: cargo test --release --manifest-path site/Cargo.toml
      - run: cargo run --release --manifest-path site/Cargo.toml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
