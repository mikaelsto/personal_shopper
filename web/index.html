<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Running and fashion apparel from many stores, one product per screen.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Runnista">
  <title>Runnista</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <!-- The Rust build (site/) puts this stylesheet inline and adds preloads for the scripts and feed.json. -->
  <link rel="stylesheet" href="feed.css" data-inline>
  <script>
    // The build pre-renders the first products of the default feed (no filters) into #feed, so
    // they show before any script or data has loaded. With your own filters (in the link or saved
    // in this browser) they'd be the wrong products: hide them and show the spinner instead.
    (() => {
      const get = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
      const q = new URLSearchParams(location.search);
      const f = get('feedFilters') ?? {}, pal = get('paletteSelection') ?? {};
      const custom = ['cat', 'for', 'size', 'palette', 'color', 'exclude'].some((k) => q.get(k))
        || f.category || f.gender || Object.values(f.sizes ?? {}).some((s) => s.length)
        || pal.palettes?.length || pal.colors?.length || pal.exclude?.length || get('hiddenStores')?.length;
      if (custom) document.documentElement.classList.add('custom');
    })();
  </script>
</head>
<body>
  <!-- One product per screen: swipe up for the next, drag the photo left for its details. -->
  <main id="feed" class="feed" aria-label="Products"><!--prerender--></main>

  <div id="loading" class="loading" role="status">
    <span class="spinner" aria-hidden="true"></span>
    <span>Loading products…</span>
  </div>

  <!-- Navigation layer, opened from ☰ in the photo's footer -->
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-grab" aria-hidden="true"><i></i></div>
    <header class="sheet-head">
      <h2 id="sheet-title" class="sr-only">Navigation</h2>
      <div class="tabs" role="tablist" aria-label="Navigation">
        <button role="tab" id="tab-saved" data-tab="saved" aria-controls="sheet-body" aria-label="Saved products">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-9.3-9.2C1.4 7.4 3.6 4 7 4c2.1 0 3.6 1.2 5 3 1.4-1.8 2.9-3 5-3 3.4 0 5.6 3.4 4.3 6.8C19.5 15.4 12 20 12 20z"/></svg>
        </button>
        <button role="tab" id="tab-colours" data-tab="colours" aria-controls="sheet-body">Colours</button>
        <button role="tab" id="tab-categories" data-tab="categories" aria-controls="sheet-body">Categories</button>
        <button role="tab" id="tab-sizes" data-tab="sizes" aria-controls="sheet-body">Sizes</button>
      </div>
      <button class="icon-btn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div id="sheet-body" class="sheet-body" role="tabpanel"></div>
    <footer class="sheet-foot">
      <button id="clear-all" class="btn ghost">Clear all</button>
      <button id="show" class="btn primary" data-close>Show products</button>
    </footer>
  </dialog>

  <script type="module" src="feed.js"></script>
</body>
</html>
