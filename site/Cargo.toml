[package]
name = "personal-shopper-site"
version = "0.1.0"
edition = "2021"
description = "Builds Runnista's static site (GitHub Pages) from data/*.json"
publish = false

[[bin]]
name = "build-site"
path = "src/main.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
